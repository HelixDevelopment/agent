# HelixLLM Infrastructure Only
# This starts just the infrastructure services without building HelixLLM

version: '3.8'

services:
  # HelixLLM PostgreSQL Database
  helixllm-postgres:
    image: docker.io/postgres:16-alpine
    container_name: helixagent-helixllm-postgres
    environment:
      POSTGRES_DB: ${HELIX_LLM_DB_NAME:-helixllm}
      POSTGRES_USER: ${HELIX_LLM_DB_USER:-helix}
      POSTGRES_PASSWORD: ${HELIX_LLM_DB_PASSWORD:-helixllm}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8"
    volumes:
      - helixllm_postgres_data:/var/lib/postgresql/data
    ports:
      - "${HELIX_LLM_DB_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${HELIX_LLM_DB_USER:-helix} -d ${HELIX_LLM_DB_NAME:-helixllm}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # HelixLLM Redis Cache
  helixllm-redis:
    image: docker.io/redis:7-alpine
    container_name: helixagent-helixllm-redis
    command: redis-server --requirepass ${HELIX_LLM_REDIS_PASSWORD:-helixllm123} --appendonly yes
    volumes:
      - helixllm_redis_data:/data
    ports:
      - "${HELIX_LLM_REDIS_PORT:-6381}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${HELIX_LLM_REDIS_PASSWORD:-helixllm123}", "--no-auth-warning", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # HelixLLM Vector Database (Qdrant)
  helixllm-qdrant:
    image: qdrant/qdrant:latest
    container_name: helixagent-helixllm-qdrant
    ports:
      - "${HELIX_LLM_QDRANT_HTTP_PORT:-6333}:6333"
      - "${HELIX_LLM_QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - helixllm_qdrant_data:/qdrant/storage
    environment:
      QDRANT__SERVICE__GRPC_PORT: 6334
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:6333/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  # HelixLLM Kafka for messaging
  helixllm-kafka:
    image: soldevelo/kafka:latest
    container_name: helixagent-helixllm-kafka
    ports:
      - "${HELIX_LLM_KAFKA_PORT:-9093}:9092"
    environment:
      KAFKA_CFG_NODE_ID: 0
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 0@localhost:9093
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      ALLOW_PLAINTEXT_LISTENER: yes
    volumes:
      - helixllm_kafka_data:/bitnami/kafka
    restart: unless-stopped

volumes:
  helixllm_postgres_data:
  helixllm_redis_data:
  helixllm_qdrant_data:
  helixllm_kafka_data:
