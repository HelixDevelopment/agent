version: '3.8'

# =============================================================================
# COMPREHENSIVE MCP SERVERS DOCKER COMPOSE - FULL STACK
# All 60+ MCP servers containerized using the unified MCP SSE Bridge
# ZERO npm/npx dependencies at runtime - all wrapped via Go SSE bridge
#
# Port Allocation Scheme:
#   9101-9120: Core Official MCP Servers
#   9201-9220: Database MCP Servers
#   9301-9320: Vector Database MCP Servers
#   9401-9440: DevOps & Infrastructure
#   9501-9520: Browser & Web Automation
#   9601-9620: Communication
#   9701-9740: Productivity & Project Management
#   9801-9840: Search & AI
#   9901-9920: Google Services
#   9921-9940: Monitoring & Observability
#   9941-9960: Finance & Business
#   9961-9999: Design
#
# Usage:
#   docker-compose -f docker/mcp/docker-compose.mcp-full.yml up -d
#   docker-compose -f docker/mcp/docker-compose.mcp-full.yml up -d mcp-fetch mcp-git  # Start specific services
#
# =============================================================================

# Common healthcheck configuration
x-healthcheck: &default-healthcheck
  test: ["CMD", "wget", "-q", "--spider", "http://localhost:9000/health"]
  interval: 10s
  timeout: 5s
  start_period: 10s
  retries: 3

# Common service configuration
x-common: &common-config
  build:
    context: ../..
    dockerfile: docker/mcp/Dockerfile.mcp-bridge
  networks:
    - mcp-network
  restart: unless-stopped
  healthcheck:
    <<: *default-healthcheck

services:
  # ===========================================================================
  # TIER 1: CORE OFFICIAL MCP SERVERS (from MCP-Servers monorepo)
  # Ports: 9101-9120
  # ===========================================================================

  mcp-fetch:
    <<: *common-config
    mem_limit: 1g
    memswap_limit: 1g
    pids_limit: 1024
    oom_score_adj: 500
    container_name: helixagent-mcp-fetch
    ports:
      - "${HELIXAGENT_PORT_MCP_FETCH:-8200}:9000"
    environment:
      - MCP_COMMAND=npx -y @modelcontextprotocol/server-fetch

  mcp-git:
