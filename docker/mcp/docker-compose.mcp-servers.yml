version: '3.8'

# MCP Servers Docker Compose - Complete Infrastructure
# Builds and runs ALL MCP servers from local git submodules
# These servers expose stdio-based MCP protocol over TCP using socat
#
# Port Ranges:
#   9101-9199: Core MCP servers (from MCP-Servers monorepo)
#   9201-9299: Database MCP servers
#   9301-9399: Vector database MCP servers
#   9401-9499: DevOps/Infrastructure MCP servers
#   9501-9599: Browser automation MCP servers
#   9601-9699: Communication MCP servers
#   9701-9799: Productivity MCP servers
#   9801-9899: Search/AI MCP servers
#   9901-9999: Cloud provider MCP servers

services:
  # =============================================================================
  # Core MCP Servers (from MCP-Servers monorepo) - Ports 9101-9199
  # =============================================================================

  mcp-fetch:
    build:
      context: ../../../../mcp_servers
      dockerfile: ../submodules/helix_agent/docker/mcp/Dockerfile.mcp-server
      args:
        SERVER_NAME: fetch
    container_name: helixagent-mcp-fetch
    mem_limit: 1g
    memswap_limit: 1g
    pids_limit: 1024
    oom_score_adj: 500
    ports:
      - "${HELIXAGENT_PORT_MCP_FETCH:-8200}:9000"
    restart: unless-stopped
    volumes:
      - ./mcp_healthcheck.sh:/mcp_healthcheck.sh:ro
    healthcheck:
      # HXC-334: real MCP `initialize` round-trip. The previous
      # ["CMD","nc","-z","localhost","9000"] reported healthy for servers that
      # crash on every connection, because socat accepts the TCP connection
      # regardless of whether the wrapped server works.
      test: ["CMD", "sh", "/mcp_healthcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  mcp-git:
