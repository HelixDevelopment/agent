    build:
      context: ../../MCP/submodules/github-mcp-server
      dockerfile: ../../../docker/mcp/Dockerfile.mcp-go
    container_name: helixagent-mcp-github
    mem_limit: 1g
    memswap_limit: 1g
    pids_limit: 1024
    oom_score_adj: 500
    ports:
      - "${HELIXAGENT_PORT_MCP_GITLAB:-8221}:9000"
    environment:
      - GITHUB_PERSONAL_ACCESS_TOKEN=${GITHUB_TOKEN}
    # HXC-334 argv fix: Dockerfile.mcp-go's /entrypoint.sh runs the first
    # executable in /app/bin with NO arguments. `github-mcp-server` is a cobra
    # CLI whose server lives behind the `stdio` subcommand, so a bare invocation
    # printed root help ("A GitHub MCP server that handles various tools and
    # resources.") to the socket and exited 0 -- which is what clients saw on
    # port 8221 instead of MCP.
    # NOTE: this alone does NOT make the server work. Measured 2026-08-13:
    # `github-mcp-server stdio` still exits with "authentication required: set
    # GITHUB_PERSONAL_ACCESS_TOKEN, or pass --oauth-client-id" while GITHUB_TOKEN
    # is unset. The fix converts a confusing usage-text reply into an explicit,
    # visible credential error, and is the correct invocation once a token exists.
    command: ["sh", "-c", "exec socat TCP-LISTEN:9000,reuseaddr,fork SYSTEM:'/app/bin/github-mcp-server stdio'"]
    restart: unless-stopped
    volumes:
      - ./mcp_healthcheck.sh:/mcp_healthcheck.sh:ro
    healthcheck:
      # HXC-334: real MCP `initialize` round-trip. The previous
      # ["CMD","nc","-z","localhost","9000"] reported healthy for servers that
      # crash on every connection, because socat accepts the TCP connection
      # regardless of whether the wrapped server works.
