services:
  # Mock LLM Server for testing (provides OpenAI, Claude, and Ollama compatible APIs)
  mock-llm:
    build:
      context: ./tests/mock-llm-server
      dockerfile: Dockerfile
    container_name: helixagent-mock-llm
    mem_limit: 2g
    memswap_limit: 2g
    pids_limit: 1024
    oom_score_adj: 500
    ports:
      - "${MOCK_LLM_PORT:-18081}:8090"
    environment:
      PORT: "8090"
    networks:
      - helixagent-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8090/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  # OAuth Mock Server for testing OAuth flows
  oauth-mock:
    image: ghcr.io/navikt/mock-oauth2-server:2.1.0
    container_name: helixagent-oauth-mock
    mem_limit: 2g
    memswap_limit: 2g
    pids_limit: 1024
    oom_score_adj: 500
    ports:
      - "${OAUTH_MOCK_PORT:-18091}:7061"
    environment:
      # The image listens on 8080 unless SERVER_PORT is set, and JSON_CONFIG has no
      # port property — so the port mapping and healthcheck below only reach a live
      # listener when 7061 is set explicitly here (same as docker-compose.ci.yml:236).
      - SERVER_PORT=7061
      - JSON_CONFIG_PATH=/config/config.json
    volumes:
      - ./tests/oauth-mock-config.json:/config/config.json
    networks:
      - helixagent-network
    healthcheck:
      # Discovery is served per-issuer at /{issuerId}/.well-known/openid-configuration;
      # a bare /.well-known/... is not an endpoint. "default" matches the ci variant.
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:7061/default/.well-known/openid-configuration"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: helixagent-postgres
    mem_limit: 4g
    memswap_limit: 4g
    pids_limit: 1024
    oom_score_adj: 500
    environment:
      POSTGRES_DB: helixagent_db
      POSTGRES_USER: helixagent
      POSTGRES_PASSWORD: helixagent123
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8"
    ports:
      - "${POSTGRES_PORT:-15432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    networks:
      - helixagent-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U helixagent -d helixagent_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: helixagent-redis
    mem_limit: 1g
    memswap_limit: 1g
    pids_limit: 1024
    oom_score_adj: 500
    # Single source of truth for the Redis password: the server command, the
    # healthcheck below and the helixagent service all resolve to this one scalar.
    environment:
      REDIS_PASSWORD: &redis_password helixagent123
    command: ["redis-server", "--requirepass", *redis_password, "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-16379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - helixagent-network
    healthcheck:
      # Authenticates with the same password the server enforces, and asserts the
      # PONG payload so a NOAUTH / wrong-password reply can never report healthy.
      test: ["CMD-SHELL", 'redis-cli --no-auth-warning -a "$$REDIS_PASSWORD" ping | grep -q PONG']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Ollama for local LLM testing (free, no API keys needed)
  ollama:
    image: ollama/ollama:latest
    container_name: helixagent-ollama
    mem_limit: 12g
    memswap_limit: 12g
    pids_limit: 2048
    oom_score_adj: 500
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - helixagent-network
    environment:
      - OLLAMA_HOST=0.0.0.0
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # HelixAgent Application
  helixagent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: helixagent-app
    mem_limit: 4g
    memswap_limit: 4g
    pids_limit: 2048
    oom_score_adj: 500
    ports:
      - "8080:7061"
    environment:
      # Local-first serving switches (spec 002 / HA-F2-002) — see
      # docker-compose.yml for the rationale: the gate reads the PROCESS
      # environment, so a switch not named here cannot reach the server.
      HELIX_CLOUD_PROVIDERS: ${HELIX_CLOUD_PROVIDERS:-}
      USE_HELIX_LLM: ${USE_HELIX_LLM:-}
      HELIX_LLM_ENDPOINT: ${HELIX_LLM_ENDPOINT:-}
      HELIX_LLM_API_KEY: ${HELIX_LLM_API_KEY:-}
      HELIX_LLM_TLS_SKIP_VERIFY: ${HELIX_LLM_TLS_SKIP_VERIFY:-}

      # Server Configuration
      # PORT drives the actual listen address: internal/config/config.go:315
      # (getEnv("PORT", "7061")) -> cmd/helixagent/main.go:1792 HTTP3Config.Address ->
      # internal/transport/http3.go:105 ListenAndServe. It MUST equal the container-side
      # port of the "8080:7061" mapping and the :7061 healthcheck below (and Dockerfile
      # EXPOSE 7061). Host-side exposure stays 8080 via the mapping.
      PORT: "7061"
      HELIXAGENT_API_KEY: test-api-key-for-development

      # JWT Configuration
      JWT_SECRET: development-jwt-secret-key-change-in-production

      # Database Configuration
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: helixagent
      DB_PASSWORD: helixagent123
      DB_NAME: helixagent_db

      # Redis Configuration
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: *redis_password

      # LLM Provider Configuration (using mock server for testing)
      # All providers point to mock-llm server for deterministic testing.
      # Port 8090 is the in-network listen port (mock-llm PORT=8090 / EXPOSE 8090);
      # the "${MOCK_LLM_PORT:-18081}" mapping is host-side only.
      CLAUDE_API_KEY: "mock-api-key"
      CLAUDE_BASE_URL: http://mock-llm:8090/v1
      DEEPSEEK_API_KEY: "mock-api-key"
      DEEPSEEK_BASE_URL: http://mock-llm:8090/v1
      GEMINI_API_KEY: "mock-api-key"
      GEMINI_BASE_URL: http://mock-llm:8090/v1
      QWEN_API_KEY: "mock-api-key"
      QWEN_BASE_URL: http://mock-llm:8090/v1
      ZAI_API_KEY: "mock-api-key"
      ZAI_BASE_URL: http://mock-llm:8090/v1

      # Ollama Configuration (also pointing to mock server)
      OLLAMA_BASE_URL: http://mock-llm:8090
      OLLAMA_MODEL: mock-llama-3

      # Cognee Configuration (disabled for testing)
      COGNEE_BASE_URL: ""
      COGNEE_API_KEY: ""
      COGNEE_AUTO_COGNIFY: false

      # Plugin Configuration
      PLUGIN_WATCH_PATHS: /app/plugins

      # Models.dev Configuration for Testing
      MODELSDEV_ENABLED: false
      MODELSDEV_API_KEY: ""
      MODELSDEV_BASE_URL: "https://api.test.models.dev/v1"
      MODELSDEV_REFRESH_INTERVAL: "5m"
      MODELSDEV_CACHE_TTL: "1m"
      MODELSDEV_BATCH_SIZE: 10
      MODELSDEV_MAX_RETRIES: 1
      MODELSDEV_AUTO_REFRESH: false
      MODELSDEV_TIMEOUT: 5
      MODELSDEV_USER_AGENT: "HelixAgent-Test/1.0"
      MODELSDEV_RATE_LIMIT: 5

      # Test Environment
      GIN_MODE: release
      LOG_LEVEL: info
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mock-llm:
        condition: service_healthy
      ollama:
        condition: service_healthy
    volumes:
      - ./plugins:/app/plugins
    networks:
      - helixagent-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7061/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # Prometheus Monitoring
  prometheus:
    image: prom/prometheus:latest
    container_name: helixagent-prometheus
    mem_limit: 2g
    memswap_limit: 2g
    pids_limit: 1024
    oom_score_adj: 500
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    networks:
      - helixagent-network
    restart: unless-stopped

  # Grafana Dashboard
  grafana:
    image: grafana/grafana:latest
    container_name: helixagent-grafana
    mem_limit: 1g
    memswap_limit: 1g
    pids_limit: 1024
    oom_score_adj: 500
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin123
      GF_USERS_ALLOW_SIGN_UP: false
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docs/monitoring/grafana-dashboard.json:/etc/grafana/provisioning/dashboards/helixagent.json
      - ./monitoring/grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml
      - ./monitoring/grafana-dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml
    networks:
      - helixagent-network
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  ollama_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

networks:
  helixagent-network:
    driver: bridge
