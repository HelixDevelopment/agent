version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: helixagent-postgres
    mem_limit: 4g
    memswap_limit: 4g
    pids_limit: 1024
    oom_score_adj: 500
    environment:
      POSTGRES_DB: helixagent_db
      POSTGRES_USER: helixagent
      POSTGRES_PASSWORD: helixagent123
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U helixagent -d helixagent_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - helixagent-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: helixagent-redis
    mem_limit: 1g
    memswap_limit: 1g
    pids_limit: 1024
    oom_score_adj: 500
    command: redis-server --requirepass helixagent123
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - helixagent-network

  # HelixAgent Multi-Provider Server
  helixagent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: helixagent-server
    mem_limit: 4g
    memswap_limit: 4g
    pids_limit: 2048
    oom_score_adj: 500
    ports:
      - "8080:8080"
    environment:
      # Local-first serving switches (spec 002 / HA-F2-002) — see
      # docker-compose.yml for the rationale: the gate reads the PROCESS
      # environment, so a switch not named here cannot reach the server.
      HELIX_CLOUD_PROVIDERS: ${HELIX_CLOUD_PROVIDERS:-}
      USE_HELIX_LLM: ${USE_HELIX_LLM:-}
      HELIX_LLM_ENDPOINT: ${HELIX_LLM_ENDPOINT:-}
      HELIX_LLM_API_KEY: ${HELIX_LLM_API_KEY:-}
      HELIX_LLM_TLS_SKIP_VERIFY: ${HELIX_LLM_TLS_SKIP_VERIFY:-}

      # Database Configuration
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: helixagent
      DB_PASSWORD: helixagent123
      DB_NAME: helixagent_db

      # Redis Configuration
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: helixagent123
      REDIS_DB: 0

      # Multi-Provider API Keys (set your actual keys here)
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      QWEN_API_KEY: ${QWEN_API_KEY}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}

      # Server Configuration
      HELIXAGENT_HOST: 0.0.0.0
      HELIXAGENT_PORT: 8080
      HELIXAGENT_DEBUG: "false"

      # JWT Configuration
      JWT_SECRET: helixagent-jwt-secret-key-minimum-32-characters-long

      # Configuration Path
      CONFIG_PATH: /app/configs/multi-provider.yaml

      # CORS and Security
      CORS_ORIGINS: "*"
      RATE_LIMIT_REQUESTS: 100
      RATE_LIMIT_WINDOW: 1m

      # Logging
      LOG_LEVEL: info
      LOG_FORMAT: json

      # Metrics
      PROMETHEUS_ENABLED: "true"
      PROMETHEUS_PORT: 9090

      # MCP/LSP
      MCP_ENABLED: "true"
      LSP_ENABLED: "true"

      # Models.dev Configuration
      MODELSDEV_ENABLED: ${MODELSDEV_ENABLED:-false}
      MODELSDEV_API_KEY: ${MODELSDEV_API_KEY:-}
      MODELSDEV_BASE_URL: ${MODELSDEV_BASE_URL:-https://api.models.dev/v1}
      MODELSDEV_REFRESH_INTERVAL: ${MODELSDEV_REFRESH_INTERVAL:-24h}
      MODELSDEV_CACHE_TTL: ${MODELSDEV_CACHE_TTL:-1h}
      MODELSDEV_BATCH_SIZE: ${MODELSDEV_BATCH_SIZE:-100}
      MODELSDEV_MAX_RETRIES: ${MODELSDEV_MAX_RETRIES:-3}
      MODELSDEV_AUTO_REFRESH: ${MODELSDEV_AUTO_REFRESH:-true}
      MODELSDEV_TIMEOUT: ${MODELSDEV_TIMEOUT:-30}
      MODELSDEV_USER_AGENT: ${MODELSDEV_USER_AGENT:-helix_agent/1.0}
      MODELSDEV_RATE_LIMIT: ${MODELSDEV_RATE_LIMIT:-10}

      # Ensemble Configuration
      ENSEMBLE_STRATEGY: confidence_weighted
      ENSEMBLE_MIN_PROVIDERS: 2
      ENSEMBLE_MAX_PROVIDERS: 4
      CONFIDENCE_THRESHOLD: 0.75
      TIMEOUT_SECONDS: 60

    volumes:
      - ./configs:/app/configs:ro
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - helixagent-network

  # Prometheus for Metrics
  prometheus:
    image: prom/prometheus:latest
    container_name: helixagent-prometheus
    mem_limit: 2g
    memswap_limit: 2g
    pids_limit: 1024
    oom_score_adj: 500
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    networks:
      - helixagent-network
    profiles:
      - monitoring
      - full

  # Grafana for Visualization
  grafana:
    image: grafana/grafana:latest
    container_name: helixagent-grafana
    mem_limit: 1g
    memswap_limit: 1g
    pids_limit: 1024
    oom_score_adj: 500
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin123
      GF_INSTALL_PLUGINS: ""
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - helixagent-network
    profiles:
      - monitoring
      - full

# Volumes for data persistence
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

# Networks
networks:
  helixagent-network:
    driver: bridge
